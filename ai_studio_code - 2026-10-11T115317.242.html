<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ruteo Pro AI</title>
    <meta name="theme-color" content="#0047BB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- PWA Manifest Generado Dinámicamente -->
    <script>
        const manifestJSON = JSON.stringify({
            "name": "Ruteo Pro AI", "short_name": "RuteoPro", "start_url": window.location.href.split('#')[0],
            "display": "standalone", "background_color": "#F3F4F6", "theme_color": "#0047BB",
            "icons": [{"src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgZmlsbD0iIzAwNDdCQiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTQlIiBmb250LXNpemU9IjM2MCIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtd2VpZ2h0PSI5MDAiIGZpbGw9IiNGRkZGRkYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiPlI8L3RleHQ+PC9zdmc+", "sizes": "512x512", "type": "image/svg+xml"}]
        });
        document.write('<link rel="manifest" href="data:application/manifest+json;charset=utf-8,' + encodeURIComponent(manifestJSON) + '">');
    </script>

    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --bg: #F3F4F6; --surface: #FFFFFF; --text-main: #111827; --text-sec: #6B7280; --accent: #0047BB; --success: #10B981; --danger: #EF4444; --warning: #F59E0B; --border: #E5E7EB; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; padding-top: env(safe-area-inset-top); }
        
        /* Header & Nav */
        header { padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 10; display: flex; justify-content: space-between; align-items: center;}
        h1 { margin: 0; font-size: 22px; font-weight: 800; color: var(--accent); }
        .badge { background: #DBEAFE; color: var(--accent); padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: 700; }
        
        nav { display: flex; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
        nav button { flex: 1; padding: 14px 4px; background: none; border: none; color: var(--text-sec); font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.3s; }
        nav button.active { color: var(--accent); }
        nav button span { font-size: 20px; }

        /* Main Content Areas */
        main { flex: 1; position: relative; overflow: hidden; }
        section { position: absolute; inset: 0; overflow-y: auto; padding: 16px; opacity: 0; transform: translateX(20px); transition: all 0.3s ease; pointer-events: none; z-index: 0; padding-bottom: 80px;}
        section.active { opacity: 1; transform: translateX(0); pointer-events: auto; z-index: 1; }

        /* Tab 1: Cámara Scanner */
        #cam-container { position: absolute; inset: 0; background: #000; overflow: hidden; border-radius: 16px; margin: 16px; height: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,0.2);}
        video { width: 100%; height: 100%; object-fit: cover; }
        #crop-box { position: absolute; border: 2px solid var(--warning); box-shadow: 0 0 0 9999px rgba(0,0,0,0.6); border-radius: 8px; touch-action: none; transition: border-color 0.3s; }
        #crop-handle { position: absolute; right: -12px; bottom: -12px; width: 36px; height: 36px; background: var(--warning); border-radius: 50%; border: 4px solid transparent; }
        .cam-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 10; }
        .btn-cam { background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); border: 2px solid white; color: white; border-radius: 30px; padding: 12px 24px; font-weight: 700; font-size: 14px; }
        .btn-cam.primary { background: white; color: black; border: none; padding: 14px 32px; }

        /* Tab 2 & 3: Upload & Rutas */
        .upload-card { background: var(--surface); border: 2px dashed var(--border); border-radius: 16px; padding: 32px 20px; text-align: center; margin-bottom: 16px; }
        .upload-card h3 { margin: 10px 0 4px; color: var(--text-main); }
        .upload-card p { margin: 0 0 16px; color: var(--text-sec); font-size: 14px; }
        .btn-upload { background: var(--accent); color: white; padding: 14px 24px; border-radius: 12px; font-weight: 700; display: inline-block; text-decoration: none; border: none; width: 100%; font-size: 16px;}
        
        .address-card { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
        .card-top { display: flex; gap: 12px; align-items: flex-start; }
        .num-badge { background: var(--accent); color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0; }
        .info { flex: 1; }
        .info h4 { margin: 0 0 4px; font-size: 15px; line-height: 1.3; }
        .info p { margin: 0; font-size: 13px; color: var(--text-sec); }
        .drag-handle { color: #9CA3AF; font-size: 20px; cursor: grab; padding: 4px; }
        .card-actions { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }
        .card-btn { flex: 1; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 700; border: none; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .btn-del { background: #FEE2E2; color: var(--danger); }
        .btn-map { background: #DBEAFE; color: var(--accent); }

        /* Global UI */
        .btn-main { background: var(--success); color: white; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; width: 100%; display: flex; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(16,185,129,0.3); margin-top: 16px; text-decoration: none;}
        #loading { display: none; text-align: center; padding: 40px 20px; }
        .spinner { border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: flex-end; backdrop-filter: blur(4px); }
        .modal-content { background: var(--bg); width: 100%; border-radius: 24px 24px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s; }
        .modal.active .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-header h3 { margin: 0; font-size: 18px; }
        .close-btn { background: var(--border); border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; }
        #mapContainer { height: 300px; border-radius: 12px; margin-bottom: 16px; background: #e5e5e5; }
    </style>
</head>
<body>

    <header>
        <h1>Ruteo Pro <span style="color:var(--text-main)">AI</span></h1>
        <div class="badge" id="statusBadge">0 Paradas</div>
    </header>

    <main>
        <!-- TAB 1: CÁMARA -->
        <section id="tab-cam" class="active" style="padding:0;">
            <div id="cam-container">
                <video playsinline autoplay muted id="video"></video>
                <div id="crop-box"><div id="crop-handle"></div></div>
                <div class="cam-controls">
                    <button class="btn-cam" id="btnAuto">Auto: OFF</button>
                    <button class="btn-cam primary" id="btnCapture">📸 Capturar</button>
                </div>
            </div>
        </section>

        <!-- TAB 2: ARCHIVOS -->
        <section id="tab-file">
            <div class="upload-card">
                <span style="font-size: 40px;">🖼️</span>
                <h3>Capturas de Pantalla</h3>
                <p>Sube una imagen con múltiples direcciones. La IA extraerá y optimizará la ruta completa.</p>
                <label class="btn-upload" for="imageUpload">Subir Imagen</label>
                <input type="file" id="imageUpload" accept="image/*" style="display:none;">
            </div>
            
            <div id="loading">
                <div class="spinner"></div>
                <h3 id="loadText">Analizando con IA...</h3>
                <p style="color:var(--text-sec); font-size:14px;" id="loadSub">Extrayendo direcciones</p>
            </div>
        </section>

        <!-- TAB 3: RUTA -->
        <section id="tab-route">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 style="margin:0;">Ruta Optimizada</h3>
                <button onclick="clearRoute()" style="background:#FEE2E2; color:var(--danger); border:none; padding:6px 12px; border-radius:8px; font-weight:bold; font-size:12px;">Limpiar</button>
            </div>
            <div id="routeList">
                <p style="text-align:center; color:var(--text-sec); margin-top:40px;">No hay paradas. Usa la cámara o sube una imagen.</p>
            </div>
            <a href="#" id="btnMaps" class="btn-main" style="display:none;" target="_blank">📍 Iniciar Navegación</a>
        </section>
    </main>

    <nav>
        <button data-tab="tab-cam" class="active"><span>📷</span> Escanear</button>
        <button data-tab="tab-file"><span>🖼️</span> Archivos</button>
        <button data-tab="tab-route"><span>📍</span> Ruta</button>
    </nav>

    <!-- MODAL MAPA -->
    <div id="mapModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="mapTitle">Ajustar Pin</h3>
                <button class="close-btn" onclick="closeModal('mapModal')">&times;</button>
            </div>
            <div id="mapContainer"></div>
            <button class="btn-upload" onclick="savePin()">Fijar Ubicación Exacta</button>
        </div>
    </div>

<script>
    // --- ESTADO GLOBAL ---
    let stops = JSON.parse(localStorage.getItem('ruteo_stops')) || [];
    let customPins = JSON.parse(localStorage.getItem('ruteo_pins')) || {};
    let worker = null;
    let isProcessing = false;

    // --- NAVEGACIÓN ---
    document.querySelectorAll('nav button').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('nav button, section').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
            if(btn.dataset.tab === 'tab-route') renderRoute();
        }
    });

    // --- INICIALIZAR TESSERACT ---
    async function initTesseract() {
        if(worker) return;
        worker = await Tesseract.createWorker('spa');
        await worker.setParameters({ tessedit_pageseg_mode: '6' });
    }

    // --- CÁMARA Y RECUADRO ---
    const video = document.getElementById('video');
    const cropBox = document.getElementById('crop-box');
    const cropHandle = document.getElementById('crop-handle');
    let box = { x: 0.1, y: 0.3, w: 0.8, h: 0.2 };
    let autoCap = false;

    async function startCamera() {
        try {
            video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: {ideal: 1920} } });
            setTimeout(layoutBox, 500);
        } catch(e) { console.warn("Sin cámara"); }
    }

    function layoutBox() {
        const W = video.clientWidth, H = video.clientHeight;
        if(!W) return;
        Object.assign(cropBox.style, { left: box.x*W+'px', top: box.y*H+'px', width: box.w*W+'px', height: box.h*H+'px' });
    }

    function drag(el, fn) {
        el.addEventListener('pointerdown', e => {
            e.preventDefault(); el.setPointerCapture(e.pointerId);
            let px = e.clientX, py = e.clientY;
            const mv = v => { fn(v.clientX - px, v.clientY - py, video.clientWidth, video.clientHeight); px = v.clientX; py = v.clientY; layoutBox(); };
            const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); };
            el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
        });
    }

    drag(cropBox, (dx, dy, W, H) => { box.x = Math.max(0, Math.min(1-box.w, box.x + dx/W)); box.y = Math.max(0, Math.min(1-box.h, box.y + dy/H)); });
    drag(cropHandle, (dx, dy, W, H) => { box.w = Math.max(0.2, Math.min(1-box.x, box.w + dx/W)); box.h = Math.max(0.1, Math.min(1-box.y, box.h + dy/H)); });

    window.addEventListener('resize', layoutBox);
    startCamera();

    document.getElementById('btnAuto').onclick = e => {
        autoCap = !autoCap;
        e.target.innerText = `Auto: ${autoCap ? 'ON' : 'OFF'}`;
        e.target.style.background = autoCap ? 'var(--success)' : 'rgba(255,255,255,0.2)';
    };

    // --- CAPTURA Y PROCESAMIENTO OCR ---
    document.getElementById('btnCapture').onclick = () => captureFromCamera();
    document.getElementById('imageUpload').onchange = e => { if(e.target.files.length) processImage(e.target.files[0]); };

    async function captureFromCamera() {
        if(isProcessing || !video.videoWidth) return;
        navigator.vibrate?.(50);
        const W = video.clientWidth, H = video.clientHeight, vw = video.videoWidth, vh = video.videoHeight;
        const s = Math.max(W/vw, H/vh), ox = (vw*s - W)/2, oy = (vh*s - H)/2;
        const sx = (box.x*W + ox)/s, sy = (box.y*H + oy)/s, sw = box.w*W/s, sh = box.h*H/s;
        
        const c = document.createElement('canvas'); c.width = sw; c.height = sh;
        c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
        
        document.querySelector('nav button[data-tab="tab-route"]').click();
        await processImage(c.toDataURL('image/jpeg'));
    }

    async function processImage(source) {
        isProcessing = true;
        document.getElementById('loading').style.display = 'block';
        document.querySelector('.upload-card').style.display = 'none';
        
        try {
            await initTesseract();
            document.getElementById('loadText').innerText = "Leyendo texto...";
            const { data: { text } } = await worker.recognize(source);
            
            document.getElementById('loadText').innerText = "Geocodificando...";
            let newStops = parseAddresses(text);
            
            if(newStops.length > 0) {
                newStops = await geocodeStops(newStops);
                stops = stops.concat(newStops);
                
                document.getElementById('loadText').innerText = "Optimizando Ruta (2-Opt)...";
                stops = solveTSP(stops); // APLICAR ALGORITMO AVANZADO
                
                localStorage.setItem('ruteo_stops', JSON.stringify(stops));
                renderRoute();
                navigator.vibrate?.([50,50,50]);
            } else {
                alert("No se detectaron direcciones válidas.");
            }
        } catch(e) {
            alert("Error al procesar: " + e.message);
        }
        
        isProcessing = false;
        document.getElementById('loading').style.display = 'none';
        document.querySelector('.upload-card').style.display = 'block';
    }

    // --- PARSEO INTELIGENTE (Regex Combinado) ---
    function parseAddresses(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 5);
        let found = [];
        
        // Regex que detecta Calle + Número o Bloque + Distrito opcional
        const rx = /(?:av|ca|jr|avenida|calle|jir[oó]n|pasaje|malec[oó]n)\.?\s+([A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9.' \n-]+?)\s+(\d+|block\s*[a-zA-Z0-9]+|bloque\s*[a-zA-Z0-9]+)(?:\s*(?:,|dpto\.?|int\.?|-)\s*([A-Za-z0-9]+))?/i;
        
        lines.forEach(line => {
            let m = line.match(rx);
            if(m) {
                let street = m[1].replace(/^[oO0-9\)\.\-\s]+/, '').trim();
                let num = m[2].trim();
                let apt = m[3] ? m[3].trim() : null;
                let addr = `${street} ${num}, Lima`; // Default Lima para mejor geocoding
                
                if(!found.find(s => s.raw === addr)) {
                    found.push({ raw: addr, display: `${street} ${num}`, apt: apt, lat: null, lon: null });
                }
            }
        });
        return found;
    }

    // --- GEOCODIFICACIÓN (Nominatim) ---
    async function geocodeStops(list) {
        for(let s of list) {
            if(customPins[s.raw]) {
                s.lat = customPins[s.raw].lat; s.lon = customPins[s.raw].lon;
                continue;
            }
            try {
                let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(s.raw + ', Peru')}&limit=1`);
                let data = await res.json();
                if(data.length > 0) { s.lat = parseFloat(data[0].lat); s.lon = parseFloat(data[0].lon); }
            } catch(e) {}
            await new Promise(r => setTimeout(r, 300)); // Respetar rate limit
        }
        return list;
    }

    // --- ALGORITMO TSP (Nearest Neighbor + 2-Opt) ---
    // Esta es la mejora principal inspirada en repositorios top de GitHub para optimización de rutas.
    function getDistance(lat1, lon1, lat2, lon2) {
        if(!lat1 || !lat2) return 9999;
        const R = 6371; const dLat = (lat2 - lat1) * Math.PI/180; const dLon = (lon2 - lon1) * Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function solveTSP(nodes) {
        if(nodes.length < 3) return nodes;
        
        // 1. Separar nodos con y sin coordenadas
        let valid = nodes.filter(n => n.lat);
        let invalid = nodes.filter(n => !n.lat);
        if(valid.length < 3) return valid.concat(invalid);

        // 2. Nearest Neighbor Inicial (Heurística constructiva)
        let route = [valid.shift()]; // Tomar el primero como inicio
        while(valid.length > 0) {
            let last = route[route.length-1];
            let bestIdx = 0, minDist = Infinity;
            for(let i=0; i<valid.length; i++) {
                let d = getDistance(last.lat, last.lon, valid[i].lat, valid[i].lon);
                if(d < minDist) { minDist = d; bestIdx = i; }
            }
            route.push(valid.splice(bestIdx, 1)[0]);
        }

        // 3. Algoritmo 2-Opt (Búsqueda local para desenredar cruces)
        let improved = true;
        while(improved) {
            improved = false;
            for(let i = 0; i < route.length - 2; i++) {
                for(let j = i + 2; j < route.length - 1; j++) {
                    let d1 = getDistance(route[i].lat, route[i].lon, route[i+1].lat, route[i+1].lon) + 
                             getDistance(route[j].lat, route[j].lon, route[j+1].lat, route[j+1].lon);
                    let d2 = getDistance(route[i].lat, route[i].lon, route[j].lat, route[j].lon) + 
                             getDistance(route[i+1].lat, route[i+1].lon, route[j+1].lat, route[j+1].lon);
                    
                    if(d2 < d1) {
                        // Invertir el segmento entre i+1 y j
                        let reversed = route.slice(i+1, j+1).reverse();
                        route.splice(i+1, reversed.length, ...reversed);
                        improved = true;
                    }
                }
            }
        }
        return route.concat(invalid); // Añadir los que no tienen GPS al final
    }

    // --- RENDERIZADO UI ---
    function renderRoute() {
        const list = document.getElementById('routeList');
        const btnMaps = document.getElementById('btnMaps');
        document.getElementById('statusBadge').innerText = `${stops.length} Paradas`;
        
        if(stops.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:var(--text-sec); margin-top:40px;">No hay paradas.</p>';
            btnMaps.style.display = 'none';
            return;
        }

        list.innerHTML = '';
        stops.forEach((s, i) => {
            list.innerHTML += `
            <div class="address-card">
                <div class="card-top">
                    <div class="drag-handle">☰</div>
                    <div class="num-badge">${i+1}</div>
                    <div class="info">
                        <h4>${s.display}</h4>
                        ${s.apt ? `<p>Dpto/Int: <b>${s.apt}</b></p>` : ''}
                        ${!s.lat ? `<p style="color:var(--warning); font-size:11px;">⚠️ GPS no exacto</p>` : ''}
                    </div>
                </div>
                <div class="card-actions">
                    <button class="card-btn btn-map" onclick="openMap(${i})">📍 Ajustar Pin</button>
                    <button class="card-btn btn-del" onclick="deleteStop(${i})">🗑️ Borrar</button>
                </div>
            </div>`;
        });

        // Generar URL de Google Maps
        let waypoints = stops.filter(s => s.lat).map(s => `${s.lat},${s.lon}`).join('|');
        if(waypoints) {
            btnMaps.href = `https://www.google.com/maps/dir/?api=1&waypoints=${waypoints}&travelmode=driving`;
            btnMaps.style.display = 'flex';
        }

        // SortableJS para reordenar manualmente
        if(window.sortable) window.sortable.destroy();
        window.sortable = new Sortable(list, {
            handle: '.drag-handle', animation: 150,
            onEnd: (evt) => {
                const item = stops.splice(evt.oldIndex, 1)[0];
                stops.splice(evt.newIndex, 0, item);
                localStorage.setItem('ruteo_stops', JSON.stringify(stops));
                renderRoute();
            }
        });
    }

    function deleteStop(i) {
        stops.splice(i, 1);
        localStorage.setItem('ruteo_stops', JSON.stringify(stops));
        renderRoute();
    }

    function clearRoute() {
        if(confirm("¿Borrar toda la ruta?")) {
            stops = []; localStorage.removeItem('ruteo_stops'); renderRoute();
        }
    }

    // --- MAPA (Leaflet) ---
    let map, marker, editIndex;
    function openMap(i) {
        editIndex = i;
        let s = stops[i];
        document.getElementById('mapTitle').innerText = s.display;
        document.getElementById('mapModal').style.display = 'flex';
        setTimeout(() => document.getElementById('mapModal').classList.add('active'), 10);

        let lat = s.lat || -12.110594, lon = s.lon || -77.038483; // Default Lima
        
        setTimeout(() => {
            if(!map) {
                map = L.map('mapContainer').setView([lat, lon], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                marker = L.marker([lat, lon], {draggable: true}).addTo(map);
                map.on('move', () => marker.setLatLng(map.getCenter()));
            } else {
                map.setView([lat, lon], 16);
                marker.setLatLng([lat, lon]);
            }
            map.invalidateSize();
        }, 300);
    }

    function savePin() {
        let pos = marker.getLatLng();
        stops[editIndex].lat = pos.lat;
        stops[editIndex].lon = pos.lng;
        customPins[stops[editIndex].raw] = { lat: pos.lat, lon: pos.lng };
        
        localStorage.setItem('ruteo_stops', JSON.stringify(stops));
        localStorage.setItem('ruteo_pins', JSON.stringify(customPins));
        
        closeModal('mapModal');
        stops = solveTSP(stops); // Re-optimizar tras mover el pin
        renderRoute();
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
        setTimeout(() => document.getElementById(id).style.display = 'none', 300);
    }

    // Auto-captura por estabilidad
    let lastData = null, stable = 0;
    setInterval(() => {
        if(!autoCap || !video.videoWidth || !document.getElementById('tab-cam').classList.contains('active')) return;
        const c = document.createElement('canvas'); c.width = 32; c.height = 32;
        const g = c.getContext('2d'); g.drawImage(video, 0, 0, 32, 32);
        const d = g.getImageData(0,0,32,32).data;
        let diff = 0;
        if(lastData) {
            for(let i=0; i<d.length; i+=4) diff += Math.abs(d[i]-lastData[i]);
            if(diff / (32*32) < 5) stable++; else stable = 0;
            cropBox.style.borderColor = stable > 3 ? 'var(--success)' : 'var(--warning)';
            if(stable === 4 && !isProcessing) document.getElementById('btnCapture').click();
        }
        lastData = d;
    }, 300);

    // Carga inicial
    if(stops.length > 0) document.querySelector('nav button[data-tab="tab-route"]').click();
</script>
</body>
</html>
